<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rock Paper Scissors Game" />
  <meta name="author" content="Devanshu Koli" />
  <meta name="keywords" content="Rock Paper Scissors, Game, Rock, Paper, Scissors" />
  <meta name="robots" content="index, follow" />
  <link rel="stylesheet" href="./style.css" />
  <title>Rock Paper Scissors</title>
</head>

<body>
  <header class="navbar">
    <a id="logo" href="/" class="header-logo">
      <div class="icon">🪨 📃 ✂️</div>
      <div class="top">Rock-Paper-Sicssors</div>
    </a>

    <nav>
      <div class="accountButtonAndMenu">
        <img src="./profile.png" alt="Profile Image" height="100" width="100" />
      </div>
    </nav>
  </header>

  <main>
    <div class="heading">
      <h1>Rock Paper Scissors</h1>
    </div>

    <div id="selection-board">
      <div class="userChoice">
        <section>
          <h2>Your Choice</h2>
          <p>Rock <button>Select</button></p>
          <p>Paper <button>Select</button></p>
          <p>Scissors <button>Select</button></p>

          <div id="user-selection">You have selected <p></p>
          </div>
        </section>
      </div>

      <div class="computerChoice">
        <section>
          <h2>Computer choice</h2>
          <!-- Here I can put some animation with time -->
          <div id="computer-selection">Computer Choice <p></p>
          </div>
        </section>
      </div>
    </div>

    <div class="score-board">
      <section>
        <h2>Score Board</h2>
        <div class="score-box">
          <div id='user-win' class="user-win">
            <div>
              <!-- here will result populated-->
            </div>
            <p>Your Wins</p>
          </div>
        </div>
        <div class="score-box">
          <div id="computer-win" class="computer-win">
            <div>
              <!-- here will result populated-->
            </div>
            <p>Computer Wins</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="footer">
    <div class="foot">
      <a href="https://github.com/devanshukoli/rock-paper-scissors" rel="noreferrer noopener" target="_blank">
        <div class="text">GitHub</div>
      </a>
      <a href="https://x.com/devanshukoli" rel="noreferrer noopener" target="_blank">
        <div class="text">Twitter</div>
      </a>
    </div>
  </footer>
</body>

</html>
